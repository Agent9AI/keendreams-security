name: Bug report
description: Report a reproducible problem with KeenDreams.
body:
  - type: input
    id: version
    attributes:
      label: Commit and environment
      description: Commit hash, Node version, and local demo or deployed Worker.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples. Do not include credentials or private evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, personal data, and customer findings before attaching.
